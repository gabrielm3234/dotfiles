
# ╔══════════════════════════════════════════════════════╗
# ║           hyprland.conf — Gabriel's config          ║
# ║         Migrado do niri + noctalia-shell             ║
# ╚══════════════════════════════════════════════════════╝

# ────────────── Monitor ──────────────
# Descomente e ajuste se quiser fixar resolução (igual ao display.kdl do niri)
monitor=HDMI-A-1,1920x1080@60,0x0,1

# ────────────── Autostart ──────────────
exec-once = qs -c noctalia-shell

# ────────────── Input ──────────────
input {
    kb_layout = br
    numlock_by_default = true

    follow_mouse = 1                  # focus-follows-mouse

    touchpad {
        tap-to-click = true           # tap
        natural_scroll = true         # natural-scroll
    }

    mouse {
        # accel_profile = flat        # descomente para desativar aceleração
        # sensitivity = 0.0
    }
}

# ────────────── Geral ──────────────
general {
    gaps_in = 8
    gaps_out = 16                     # equivalente ao gaps 16 do niri
    border_size = 2
    col.active_border = rgba(cba6f7ff)
    col.inactive_border = rgba(313244ff)
    layout = dwindle
}

# ────────────── Decoração ──────────────
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        color = rgba(1a1a2ecc)
    }
}

# ────────────── Animações ──────────────
animations {
    enabled = true

    bezier = smooth, 0.05, 0.9, 0.1, 1.05
    bezier = linear, 0.0, 0.0, 1.0, 1.0
    bezier = snappy, 0.25, 1.0, 0.5, 1.0

    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 4, snappy, popin 80%
    animation = border, 1, 10, linear
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 5, snappy, slide
}

# ────────────── Layout dwindle ──────────────
dwindle {
    preserve_split = true
}

# ────────────── Misc ──────────────
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

binds {
    workspace_back_and_forth = true
}

# ════════════════════════════════════════
#                KEYBINDS
# ════════════════════════════════════════

$mod = SUPER

# ─── Applications ───
bind = $mod SHIFT, ESCAPE, exec, qs -c noctalia-shell ipc call hotkey-overlay toggle
bind = $mod, Return,       exec, alacritty
bind = $mod CTRL, Return,  exec, qs -c noctalia-shell ipc call launcher toggle
bind = $mod, B,            exec, firefox
bind = $mod ALT, L,        exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mod SHIFT, Q,      exec, qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mod, E,            exec, nautilus

# ─── Media Controls ───
bindel = , XF86AudioRaiseVolume,  exec, qs -c noctalia-shell ipc call volume increase
bindel = , XF86AudioLowerVolume,  exec, qs -c noctalia-shell ipc call volume decrease
bindl  = , XF86AudioMute,         exec, qs -c noctalia-shell ipc call volume muteOutput
bindl  = , XF86AudioMicMute,      exec, qs -c noctalia-shell ipc call volume muteInput
bindl  = , XF86AudioNext,         exec, qs -c noctalia-shell ipc call media next
bindl  = , XF86AudioPrev,         exec, qs -c noctalia-shell ipc call media previous
bindl  = , XF86AudioPlay,         exec, qs -c noctalia-shell ipc call media playPause
bindl  = , XF86AudioPause,        exec, qs -c noctalia-shell ipc call media playPause

# ─── Brightness ───
bindel = , XF86MonBrightnessUp,   exec, qs -c noctalia-shell ipc call brightness increase
bindel = , XF86MonBrightnessDown, exec, qs -c noctalia-shell ipc call brightness decrease

# ─── Janelas ───
bind = $mod, Q, killactive

bind = $mod, Left,  movefocus, l
bind = $mod, H,     movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, L,     movefocus, r
bind = $mod, Up,    movefocus, u
bind = $mod, K,     movefocus, u
bind = $mod, Down,  movefocus, d
bind = $mod, J,     movefocus, d

bind = $mod CTRL, Left,  movewindow, l
bind = $mod CTRL, H,     movewindow, l
bind = $mod CTRL, Right, movewindow, r
bind = $mod CTRL, L,     movewindow, r
bind = $mod CTRL, Up,    movewindow, u
bind = $mod CTRL, K,     movewindow, u
bind = $mod CTRL, Down,  movewindow, d
bind = $mod CTRL, J,     movewindow, d

# ─── Redimensionar janelas ───
bind = $mod, minus,       resizeactive, -10% 0
bind = $mod, equal,       resizeactive, 10% 0
bind = $mod SHIFT, minus, resizeactive, 0 -10%
bind = $mod SHIFT, equal, resizeactive, 0 10%

# ─── Monitores ───
bind = $mod SHIFT, Left,  focusmonitor, l
bind = $mod SHIFT, Right, focusmonitor, r
bind = $mod SHIFT, Up,    focusmonitor, u
bind = $mod SHIFT, Down,  focusmonitor, d

bind = $mod SHIFT CTRL, Left,  movewindow, mon:l
bind = $mod SHIFT CTRL, Right, movewindow, mon:r
bind = $mod SHIFT CTRL, Up,    movewindow, mon:u
bind = $mod SHIFT CTRL, Down,  movewindow, mon:d

# ─── Workspaces ───
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod CTRL, 1, movetoworkspace, 1
bind = $mod CTRL, 2, movetoworkspace, 2
bind = $mod CTRL, 3, movetoworkspace, 3
bind = $mod CTRL, 4, movetoworkspace, 4
bind = $mod CTRL, 5, movetoworkspace, 5
bind = $mod CTRL, 6, movetoworkspace, 6
bind = $mod CTRL, 7, movetoworkspace, 7
bind = $mod CTRL, 8, movetoworkspace, 8
bind = $mod CTRL, 9, movetoworkspace, 9

bind = $mod, TAB, workspace, previous

# Scroll entre workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod CTRL, mouse_down, movetoworkspace, e+1
bind = $mod CTRL, mouse_up,   movetoworkspace, e-1

# ─── Modos de janela ───
bind = $mod, T, togglefloating
bind = $mod, F, fullscreen

# ─── Screenshots (requer hyprshot) ───
# sudo pacman -S hyprshot
bind = CTRL SHIFT, 1, exec, hyprshot -m region
bind = CTRL SHIFT, 2, exec, hyprshot -m screen
bind = CTRL SHIFT, 3, exec, hyprshot -m window

# ─── Power ───
bind = $mod SHIFT, P,  dpms, off
bind = CTRL ALT, Delete, exit

# ─── Mouse drag para mover/redimensionar janelas flutuantes ───
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow



